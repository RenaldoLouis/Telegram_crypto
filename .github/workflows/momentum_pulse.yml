name: Momentum Pulse + Mechanical Scan

on:
  schedule:
    # Run every 2 hours UTC (raised from 4h 2026-08-20). CI is mechanical-only (no
    # ANTHROPIC_API_KEY), so 2x the runs = ~0 extra Claude cost — just more coverage
    # + eval velocity. The dedup window (2 days) + hot_list expiry (48h) are time-based,
    # so they stay correct at the faster cadence.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # scan is longer-running than the pulse alone
    permissions:
      contents: write  # needed to push commits back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Fetch full history so git push works
          fetch-depth: 0

      - name: Setup WireGuard VPN
        run: |
          sudo apt-get install -y -qq wireguard-tools
          echo "${{ secrets.WG_CONF }}" | base64 -d | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          sleep 2
          echo "VPN connected — exit IP: $(curl -s ifconfig.me)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # anthropic/telethon only satisfy main.py's top-level imports; with no
        # ANTHROPIC_API_KEY and no Telethon session the Claude/TG-read paths fail
        # inside try/except and the scan degrades to mechanical-only.
        run: pip install pybit requests python-dotenv pandas anthropic telethon

      - name: Run momentum pulse
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python momentum_pulse.py

      - name: Run mechanical scan (mechanical-only, no ANTHROPIC key)
        # No ANTHROPIC_API_KEY on purpose → Claude shadow throws → main.py delivers
        # the mechanical brief. Runs after the pulse so it reads the fresh hot list.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Disconnect VPN
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Commit and push pulse + scan output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/momentum/hot_list.json logs/momentum/last_snapshot.json logs/setups/ logs/briefs/
          # Nothing changed → clean exit.
          git diff --cached --quiet && exit 0
          git commit -m "scan+pulse: 4h auto-run [skip ci]"
          # Race-safe push: the local nightly run also pushes to master, so rebase
          # onto any concurrent commit and retry rather than failing on non-fast-forward.
          for i in 1 2 3; do
            git pull --rebase origin master && git push && break || sleep 5
          done
