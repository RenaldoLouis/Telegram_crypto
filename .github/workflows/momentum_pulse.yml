name: Momentum Pulse Scanner

on:
  schedule:
    # Run every 4 hours UTC
    - cron: '0 */4 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

jobs:
  pulse:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push commits back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Fetch full history so git push works
          fetch-depth: 0

      - name: Setup Cloudflare WARP
        run: |
          # Install Cloudflare WARP
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp

          # Start service and register
          sudo systemctl start warp-svc
          sleep 2
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect

          # Wait for tunnel to establish
          sleep 5
          echo "WARP connected — exit IP: $(curl -s ifconfig.me)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pybit requests python-dotenv

      - name: Run momentum pulse
        env:
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python momentum_pulse.py

      - name: Disconnect WARP
        if: always()
        run: warp-cli disconnect || true

      - name: Commit and push hot list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/momentum/hot_list.json logs/momentum/last_snapshot.json
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "pulse: update momentum hot list [skip ci]"
          git push
