name: Momentum Pulse + Mechanical Scan

on:
  schedule:
    # 2026-09-23 schedule fix. The old single '0 */2' cron was being DELAYED and DROPPED by
    # GitHub (top-of-hour is its most congested slot): the run log showed ~6 runs/day at
    # random offsets, so about half of the 4h bar closes were never scanned inside the
    # 90-min signal-freshness window (SIGNAL_MAX_AGE_MIN) — i.e. half of the forward
    # sample was silently lost. Now:
    #   - '7 */2'  : the main pulse+scan run, off the top of the hour (every 2h UTC).
    #   - '37 0,4,…' and '5 1,5,…' : scan-ONLY retries at +37 and +65 min after each 4h
    #     close, still inside the freshness window; a signal already taken by an earlier
    #     run is dropped by the cross-run dedup; SCAN_QUIET_IF_EMPTY suppresses the
    #     empty-brief archive + Telegram on these so they add no noise.
    # CI is mechanical-only (no ANTHROPIC_API_KEY) → extra runs cost zero tokens.
    - cron: '7 */2 * * *'
    - cron: '37 0,4,8,12,16,20 * * *'
    - cron: '5 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # scan is longer-running than the pulse alone
    permissions:
      contents: write  # needed to push commits back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Fetch full history so git push works
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # anthropic/telethon only satisfy main.py's top-level imports; with no
        # ANTHROPIC_API_KEY and no Telethon session the Claude/TG-read paths fail
        # inside try/except and the scan degrades to mechanical-only.
        run: pip install pybit requests python-dotenv pandas anthropic telethon

      - name: Setup WireGuard VPN (split-tunnel, health-gated)
        # Split-tunnel: ONLY Bybit routes through the VPN. Telegram is not blocked
        # for US runner IPs (the ISP block is local-only), so it goes direct — more
        # reliable than the flaky VPN. GitHub/pip traffic also stays direct, which
        # ends the "runner went dark → job canceled" failures of the full tunnel.
        uses: ./.github/actions/bybit-vpn
        with:
          wg_conf: ${{ secrets.WG_CONF }}

      - name: Run momentum pulse
        # Only on the main 2h schedule (and manual runs): the pulse's volume-acceleration
        # test compares against the PREVIOUS pulse ~2h earlier, so the +37/+65 min retry
        # runs must not overwrite that snapshot.
        if: github.event_name != 'schedule' || github.event.schedule == '7 */2 * * *'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python momentum_pulse.py

      - name: Run mechanical scan (mechanical-only, no ANTHROPIC key)
        # No ANTHROPIC_API_KEY on purpose → Claude shadow throws → main.py delivers
        # the mechanical brief. Runs after the pulse so it reads the fresh hot list.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Retry runs stay silent unless they actually surface something.
          SCAN_QUIET_IF_EMPTY: ${{ (github.event_name == 'schedule' && github.event.schedule != '7 */2 * * *') && '1' || '0' }}
        run: python main.py

      - name: Disconnect VPN
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Commit and push pulse + scan output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/momentum/hot_list.json logs/momentum/last_snapshot.json logs/setups/ logs/briefs/
          # Nothing changed → clean exit.
          git diff --cached --quiet && exit 0
          git commit -m "scan+pulse: 2h auto-run [skip ci]"
          # Race-safe push: the local nightly run also pushes to master, so rebase
          # onto any concurrent commit and retry rather than failing on non-fast-forward.
          for i in 1 2 3; do
            git pull --rebase origin master && git push && break || sleep 5
          done
