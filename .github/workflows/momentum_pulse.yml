name: Momentum Pulse Scanner

on:
  schedule:
    # Run every 4 hours UTC
    - cron: '0 */4 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

jobs:
  pulse:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push commits back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Fetch full history so git push works
          fetch-depth: 0

      - name: Setup WireGuard VPN
        run: |
          sudo apt-get install -y -qq wireguard-tools
          echo "${{ secrets.WG_CONF }}" | base64 -d | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          sleep 2
          echo "VPN connected — exit IP: $(curl -s ifconfig.me)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pybit requests python-dotenv

      - name: Run momentum pulse
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python momentum_pulse.py

      - name: Disconnect VPN
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Commit and push hot list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/momentum/hot_list.json logs/momentum/last_snapshot.json
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "pulse: update momentum hot list [skip ci]"
          git push
