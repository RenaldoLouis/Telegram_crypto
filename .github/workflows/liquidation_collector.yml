name: Liquidation Collector (chained)

# FORK A forward-collection on CI (public-repo only — free unlimited minutes).
# Ephemeral runners can't hold a stream, so we CHAIN ~5.5h jobs: each run collects
# for LIQ_MAX_SECONDS then uploads its liquidation prints as a dated ARTIFACT
# (90-day retention). Artifacts, NOT commits, so the git history stays clean.
# Coverage ≈ 5.5h per 6h window (~92%) minus GitHub's cron scheduling jitter —
# gaps are fine; liquidation CLUSTERS are what we backtest, not a complete tape.
#
# Backtest later: download all artifacts, concat the JSONL, run the cluster map.
# NOTE: this is a data collector only — zero trading decisions (CORE PRINCIPLE).

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6h UTC; each job runs ~5.5h -> near-continuous
  workflow_dispatch: {}

# Don't stack overlapping runs if a job overruns / a manual dispatch collides.
concurrency:
  group: liq-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355        # under the 6h hard cap; script self-exits before this
    permissions:
      contents: read            # artifacts only — no push, no repo write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pybit

      - name: Setup WireGuard VPN (split-tunnel, health-gated)
        uses: ./.github/actions/bybit-vpn
        with:
          wg_conf: ${{ secrets.WG_CONF }}

      - name: Collect liquidations (retry across the ~5.5h window)
        # The collector exits 1 when pybit gives up on the WS (flaky VPN endpoint).
        # Previously that forfeited the entire 6h window after ~2 min. Now: rebuild
        # the tunnel and relaunch with the REMAINING budget until the window is
        # spent — the endpoint has been observed to flap, so later attempts often
        # recover. Exit 0 only if the last attempt ended cleanly (self-exit).
        run: |
          BUDGET=19800   # 5h30m total across all attempts — margin under the 355-min job cap
          START=$SECONDS
          ATTEMPT=0
          while :; do
            REMAIN=$(( BUDGET - (SECONDS - START) ))
            if [ $REMAIN -lt 300 ]; then
              echo "::error::window budget spent without a clean collector exit"
              exit 1
            fi
            ATTEMPT=$((ATTEMPT+1))
            echo "collector attempt $ATTEMPT — ${REMAIN}s of window remaining"
            if LIQ_MAX_SECONDS=$REMAIN python liquidation_collector.py; then
              echo "clean self-exit after attempt $ATTEMPT"
              exit 0
            fi
            echo "collector died — rebuilding VPN, retrying in 30s"
            sudo wg-quick down wg0 2>/dev/null || true
            sleep 30
            sudo wg-quick up wg0 || true
            sleep 5
          done

      - name: Disconnect VPN
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Upload liquidation data
        if: always()               # upload whatever was collected, even on early failure
        uses: actions/upload-artifact@v4
        with:
          name: liquidations-${{ github.run_id }}
          path: logs/liquidations/*.jsonl
          retention-days: 90
          if-no-files-found: warn
