name: XS Momentum Paper Test (weekly)

# Forward PAPER test of the cross-sectional momentum (ex-carry) book — a separate product
# from the per-trade signal screener. Pre-registered 2026-10-05 (progress.md banner; bar is
# also printed verbatim at the top of logs/xs_momentum/scorecard.md). Research/paper only:
# zero Claude tokens, NO order API, nothing here places trades (CORE PRINCIPLE).
#
# Every Monday just after the 00:00 UTC daily close:
#   rebalance → logs/xs_momentum/weights_<monday>.json (idempotent: no-op if present)
#   score     → scores the previous Monday's weights once this Monday's close exists,
#               appends logs/xs_momentum/scores.jsonl, rewrites scorecard.md, one Telegram
#               message only when a new week was scored.
# Several shots because GitHub delays AND drops schedules (2026-10-12: both Monday crons were
# skipped outright, the first week had to be dispatched by hand). Every shot after a
# successful one is a no-op: `rebalance` targets the most recent Monday whatever day it runs
# (weights as of Monday 00:00 UTC, idempotent if the file exists) and `score` only scores
# weeks not yet in scores.jsonl. Belt and braces: scan_keeper.yml also dispatches this
# workflow after the Monday 00:00 UTC close (dispatch is not subject to schedule drops).
# Bybit is reached through the same split-tunnel VPN as the scan.

on:
  schedule:
    - cron: '20 0 * * 1'
    - cron: '50 0 * * 1'
    - cron: '23 3 * * 1'
    - cron: '23 7 * * 1'
    - cron: '23 13 * * 1'
    - cron: '23 19 * * 1'
    - cron: '23 6 * * 2'
  workflow_dispatch:

# Shots that overlap must not both score the same week (double append to scores.jsonl):
# a later shot waits, then checks out the earlier one's pushed output and no-ops.
concurrency:
  group: xs-momentum-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 60         # a real rebalance is ~520 kline calls through the tunnel (25 min was overrun 2026-10-12)
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Branch tip at job START, not the trigger-time SHA: a shot that waited in the
          # concurrency queue must see the output the earlier shot pushed.
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pybit requests python-dotenv pandas

      - name: Setup WireGuard VPN (split-tunnel, health-gated)
        uses: ./.github/actions/bybit-vpn
        with:
          wg_conf: ${{ secrets.WG_CONF }}

      - name: Rebalance (write this Monday's paper weights)
        run: python -u xs_momentum_paper.py rebalance   # -u: progress visible in the log

      - name: Score (previous week, if its closing bar now exists)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u xs_momentum_paper.py score

      - name: Disconnect VPN
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Commit and push paper-test output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/xs_momentum/
          git diff --cached --quiet && exit 0
          git commit -m "xs-momentum paper: weekly rebalance + score [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin master && git push && break || sleep 5
          done
